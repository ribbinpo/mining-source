name: Dev Mining Service

on:
  push:
    branches:
      - develop
    paths:
      - "apps/mining-service/**"
  workflow_dispatch:

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    # setup env
  test:
    name: run test
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x

      - name: Download dependencies
        working-directory: apps/mining-service
        run: go mod download

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        continue-on-error: true
        with:
          version: latest
          working-directory: apps/mining-service
          args: --timeout=5m

      - name: Run tests
        working-directory: apps/mining-service
        run: go test -v -coverprofile=coverage.out ./...
      # - name: Run SonarQube scanner
      #   uses: SonarSource/sonarcloud-github-action@v2
      #   with:
      #     projectBaseDir: apps/mining-service
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    environment: dev
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: apps/mining-service
          file: apps/mining-service/Dockerfile
          push: true
          tags: |
            mining-service:latest
            mining-service:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
# for release/x.y.z
# mining-service:${{ github.ref_name }}
